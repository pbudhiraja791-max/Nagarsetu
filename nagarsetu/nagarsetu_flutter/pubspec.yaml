name: nagarsetu_flutter
description: "NagarSetu Flutter Web - Bridge Between Citizens & Authorities"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  nagarsetu_client:
    path: ../nagarsetu_client
  serverpod_flutter: 4.1.2
  google_fonts: ^6.2.1
  file_picker: ^8.1.7
  http: ^1.3.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
