services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nagarsetu
      POSTGRES_PASSWORD: "eqnyaMssAgks9IcD2sZs3GRTcZKQiKC2"
    volumes:
      - nagarsetu_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "hggxMN5glmF4rT-5ezlEHVJ_yyr11GuF"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nagarsetu_test
      POSTGRES_PASSWORD: "5wq2WT4K8vk9vodFtusMEOCnnxTWdJvu"
    volumes:
      - nagarsetu_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "0ymct-5gDITiDHaX350bN0J3A6PbJoQe"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  nagarsetu_data:
  nagarsetu_test_data:
